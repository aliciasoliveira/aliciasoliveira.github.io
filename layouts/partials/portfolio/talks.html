<section class="resume-section p-3 p-lg-5 d-flex flex-column" id="talks">
  <div class="my-auto" id="talks-content">
  <h2 class="mb-5">{{ i18n "talks" }}</h2>
    {{ range hugo.Data.talks }}
        <div class="resume-item d-flex flex-column flex-md-row mb-5">
          <div class="resume-content mr-auto">
            <h3 class="mb-0">{{ .title }}</h3>
            {{ with .location }}<div class="subheading mb-3">{{ . }}</div>{{ end }}
            <p>{{ .summary | markdownify }}</p>
            {{ with .links }}
            <p>{{ range $i, $l := . }}{{ if $i }} · {{ end }}<a href="{{ $l }}">{{ (urls.Parse $l).Host }}</a>{{ end }}</p>
            {{ end }}
          </div>
          <div class="resume-date text-md-right">
            <span class="text-primary">{{ .range }}</span>
          </div>
        </div>
    {{ end }}
  </div>
</section>
