<section class="resume-section p-3 p-lg-5 d-flex flex-column" id="languages">
  <div class="my-auto">
  <h2 class="mb-5">{{ i18n "languages" }}</h2>
    <ul class="fa-ul mb-0">
    {{ range hugo.Data.languages }}
      <li><i class="fa-li fa fa-language text-primary"></i>{{ .language }}{{ with .level }} <span class="text-muted">({{ . }})</span>{{ end }}</li>
    {{ end }}
    </ul>
  </div>
</section>
